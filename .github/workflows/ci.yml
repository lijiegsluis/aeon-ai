name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npx eslint .
            - run: npx prettier --check .

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [frontend, worker]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json
            - run: cd ${{ matrix.package }} && npm ci
            - run: cd ${{ matrix.package }} && npx tsc --noEmit

    test:
        name: Unit Tests (${{ matrix.package }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [worker, frontend]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json
            - run: cd ${{ matrix.package }} && npm ci
            - run: cd ${{ matrix.package }} && npx vitest run --reporter=verbose

    python:
        name: Python Tests (${{ matrix.service }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [analytics, intelligence/backend]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: ${{ matrix.service }}/requirements*.txt
            - run: pip install -r ${{ matrix.service }}/requirements.txt -r ${{ matrix.service }}/requirements-dev.txt
            - run: cd ${{ matrix.service }} && python -m pytest -q tests

    intelligence-frontend:
        name: Intelligence Frontend Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: intelligence/frontend/package-lock.json
            - run: cd intelligence/frontend && npm ci
            - run: cd intelligence/frontend && npm run build
